[project]
name = "agentra-mcp"
version = "0.1.0"
description = "Agentra DMS MCP server: read-only business API tools (FastMCP)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=4.2.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
