# Design-first contract for the M32 web assistant (revised 15/11/2026: tools come from
# the Agentra MCP server, mcp-server/; the semantic model was removed). Implemented in
# backend/app/modules/chatbot/; the runtime schema in API/openapi.json (92 operations,
# generated by backend/scripts/gen_openapi.py) is authoritative where the two differ.
# Paths are relative to the /api/v1 server, like API/openapi.json.
# Supersedes POST /chatbot/queries (queryChatbot) and decision D10.
openapi: 3.1.0
info:
  title: Agentra DMS - web assistant (design-first)
  version: 2026-11-15
  description: >-
    One read-only endpoint for the floating web assistant. The server runs a short LLM
    tool loop (any OpenAI-compatible provider) over the tools of the Agentra MCP server,
    which wraps the existing read APIs and calls them with the caller's own token. Every
    table comes from a tool result, never from the model. Stateless: the client resends
    the recent conversation. Shared error bodies, X-Request-Id and the BearerAuth scheme
    are those of API/openapi.json.
servers:
  - url: /api/v1
tags:
  - name: Chatbot
paths:
  /chatbot/messages:
    post:
      tags: [Chatbot]
      operationId: sendChatbotMessage
      summary: Ask the read-only assistant about agencies, products, documents and reports
      description: >-
        Answers the latest user turn. Never writes business data. Any authenticated user
        may call it; each MCP tool applies the permissions of the operation it wraps, and
        tools the user cannot call are hidden from the model.
      security:
        - BearerAuth: []
      x-permissions:
        conditional: Authenticated; each MCP tool applies the permissions of the operation it wraps
      x-rate-limit: per user bucket `chatbot`, separate from the HTTP bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotMessageRequest'
            examples:
              ask:
                value:
                  locale: vi
                  messages:
                    - role: user
                      content: Top 5 đại lý doanh số cao nhất tháng 10
      responses:
        '200':
          description: One assistant reply.
          headers:
            X-Request-Id: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotReply'
              examples:
                answered:
                  value:
                    answer: Đây là 5 đại lý có doanh số cao nhất từ 01/10 đến 31/10/2026.
                    model: ag/gemini-3-flash
                    tools: [get_sales_report]
                    tables:
                      - title: Doanh số theo đại lý
                        tool: get_sales_report
                        columns:
                          - { key: agencyCode, type: code }
                          - { key: agencyName, type: text }
                          - { key: numberOfIssues, type: integer }
                          - { key: salesAmount, type: money }
                        rows:
                          - { agencyCode: DL-7, agencyName: Đại lý Hòa Bình, numberOfIssues: 12, salesAmount: '184500000' }
                        totalRows: 5
                        truncated: false
                        asOf: '2026-11-15T02:12:00Z'
                askBack:
                  value:
                    answer: Có 2 đại lý tên Minh Phát (DL-8, DL-23). Bạn muốn xem đại lý nào?
                    tools: [list_agencies]
                    tables:
                      - title: Đại lý
                        tool: list_agencies
                        columns:
                          - { key: agencyCode, type: code }
                          - { key: agencyName, type: text }
                          - { key: wardName, type: text }
                          - { key: debt, type: money }
                        rows:
                          - { agencyCode: DL-8, agencyName: Tạp hóa Minh Phát, wardName: Phường Gò Vấp, debt: '2743800' }
                          - { agencyCode: DL-23, agencyName: Tạp hóa Minh Phát, wardName: null, debt: '3696480' }
                        totalRows: 2
                        truncated: false
                        asOf: '2026-11-15T02:12:00Z'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          description: >-
            CHATBOT_UNAVAILABLE - the assistant is disabled or unconfigured, the MCP server
            is unreachable, every configured model failed, or the tool loop ended without
            data. The server never invents an answer in this case.
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Shared error body of API/openapi.json (code, message, requestId, fieldErrors?).
      headers:
        X-Request-Id: { schema: { type: string } }
        Retry-After: { schema: { type: string }, description: Only on 429. }
      content:
        application/json:
          schema:
            type: object
            required: [code, message, requestId]
            properties:
              code: { type: string }
              message: { type: string }
              requestId: { type: string }
              fieldErrors:
                type: array
                items:
                  type: object
                  required: [field, code, message]
                  properties:
                    field: { type: string }
                    code: { type: string }
                    message: { type: string }
  schemas:
    ChatbotMessageRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          description: Recent conversation, oldest first; the last turn must have role `user`. The server keeps no history.
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ChatTurn' }
        locale:
          description: Interface language for `answer` and table titles (one of the 24 UI locales). Data is never translated.
          type: string
          pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
          default: vi
    ChatTurn:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 2000 }
    ChatbotReply:
      type: object
      additionalProperties: false
      required: [answer, tables, tools]
      properties:
        answer:
          description: >-
            Short plain-text reply in `locale`. Post-checked: a number found neither in
            the tool results nor in the user's turns is replaced by an ellipsis.
          type: string
          minLength: 1
          maxLength: 2000
        tables:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ChatbotTable' }
        tools:
          description: MCP tools called for this answer, in call order.
          type: array
          items: { type: string }
        model: { type: string, description: Model that produced the final answer; omitted when none answered. }
    ChatbotTable:
      type: object
      additionalProperties: false
      required: [title, tool, columns, rows, totalRows, truncated, asOf]
      properties:
        title: { type: string, description: Short caption in `locale`. }
        tool: { type: string, pattern: '^[a-z_]+$', description: MCP tool whose result produced the rows. }
        columns:
          description: Keys and value types only (fixed per tool); the UI owns translated labels.
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [key, type]
            properties:
              key: { type: string, pattern: '^[A-Za-z]+$' }
              type: { type: string, enum: [code, text, money, quantity, integer, rate, date, status, kind] }
        rows:
          description: >-
            Values copied from the tool result. money/quantity/rate are exact decimal
            strings, integer is a JSON integer, other types are strings; null allowed.
            Contact data is never included.
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties:
              type: [string, integer, 'null']
        totalRows: { type: integer, minimum: 0 }
        truncated: { type: boolean, description: More rows exist (over 50 or a next page). }
        asOf: { type: string, format: date-time }
