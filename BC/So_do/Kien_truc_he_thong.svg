<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Kiến trúc ba tầng của Agentra</title>
<desc id="desc">Trình duyệt và Nginx ở tầng trình bày; FastAPI, service và repository ở tầng ứng dụng; PostgreSQL trên Supabase ở tầng dữ liệu. Backend tích hợp VNPAY và SMTP.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="black"><rect x="60" y="130" width="940" height="170" fill="white" stroke="black" stroke-width="2"/><text x="85" y="167" font-size="22" font-weight="700">TẦNG 1. TRÌNH BÀY</text>
<rect x="60" y="360" width="940" height="510" fill="white" stroke="black" stroke-width="2"/><text x="85" y="397" font-size="22" font-weight="700">TẦNG 2. ỨNG DỤNG</text>
<rect x="60" y="930" width="940" height="160" fill="white" stroke="black" stroke-width="2"/><text x="85" y="967" font-size="22" font-weight="700">TẦNG 3. DỮ LIỆU</text>
<rect x="100" y="195" width="400" height="75" fill="white" stroke="black" stroke-width="2"/><text data-box="browser" x="300" y="219.5" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">Trình duyệt người dùng</text><text data-box="browser" x="300" y="245.5" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="400">React 19 · TypeScript · SPA</text>
<rect x="620" y="195" width="340" height="75" fill="white" stroke="black" stroke-width="2"/><text data-box="nginx" x="790" y="219.5" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">Nginx</text><text data-box="nginx" x="790" y="245.5" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="400">Phục vụ UI · Proxy /api/</text>
<rect x="190" y="430" width="660" height="80" fill="white" stroke="black" stroke-width="2"/><text data-box="api" x="520" y="457" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">FastAPI: Router / Schema / Dependencies</text><text data-box="api" x="520" y="483" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="400">Nhận HTTP · Kiểm tra dữ liệu · Xác thực / RBAC</text>
<rect x="190" y="560" width="660" height="90" fill="white" stroke="black" stroke-width="2"/><text data-box="service" x="520" y="592" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">Service: xử lý nghiệp vụ</text><text data-box="service" x="520" y="618" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="400">Danh mục · Chứng từ · Kho · Công nợ · Thanh toán · Báo cáo</text>
<rect x="190" y="710" width="660" height="80" fill="white" stroke="black" stroke-width="2"/><text data-box="repository" x="520" y="737" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">Repository / SQLAlchemy 2 / psycopg 3</text><text data-box="repository" x="520" y="763" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="400">Truy vấn và ghi dữ liệu trong transaction</text>
<rect x="190" y="990" width="660" height="75" fill="white" stroke="black" stroke-width="2"/><text data-box="postgres" x="520" y="1014.5" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">PostgreSQL trên Supabase (dịch vụ bên ngoài)</text><text data-box="postgres" x="520" y="1040.5" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="400">Bảng · Khóa / ràng buộc · Trigger · Ledger · View / Function</text>
<rect x="1150" y="550" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text data-box="vnpay" x="1345" y="579" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">VNPAY</text><text data-box="vnpay" x="1345" y="605" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="400">Thanh toán online</text><text data-box="vnpay" x="1345" y="631" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="400">Tích hợp sandbox; không đồng nghĩa production</text>
<rect x="1150" y="720" width="390" height="90" fill="white" stroke="black" stroke-width="2" stroke-dasharray="8 5"/><text data-box="smtp" x="1345" y="739" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">Máy chủ SMTP</text><text data-box="smtp" x="1345" y="765" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="400">Gửi email đặt lại mật khẩu</text><text data-box="smtp" x="1345" y="791" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="400">Chỉ hoạt động khi có cấu hình hợp lệ</text>
<polyline points="500,232 620,232" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="560" y="215" text-anchor="middle" font-size="17" stroke="white" stroke-width="5" paint-order="stroke">HTTP</text>
<polyline points="790,270 790,325 520,325 520,430" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="680" y="318" text-anchor="middle" font-size="17" stroke="white" stroke-width="5" paint-order="stroke">/api/v1 · JSON</text>
<polyline points="520,510 520,560" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<polyline points="520,650 520,710" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<polyline points="520,790 520,990" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="650" y="912" text-anchor="middle" font-size="17" stroke="white" stroke-width="5" paint-order="stroke">SQL · kết nối TLS</text>
<polyline points="850,605 1150,605" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="1000" y="593" text-anchor="middle" font-size="17" stroke="white" stroke-width="5" paint-order="stroke">Checkout / Query / Refund</text>
<polyline points="1250,550 1250,470 850,470" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="1120" y="456" text-anchor="middle" font-size="17" stroke="white" stroke-width="5" paint-order="stroke">IPN đã ký (qua public ingress)</text>
<polyline points="850,630 1060,630 1060,765 1150,765" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 5"/><text x="1090" y="698" text-anchor="middle" font-size="17" stroke="white" stroke-width="5" paint-order="stroke">SMTP / TLS</text>
<text x="60" y="62" font-size="32" font-weight="700">KIẾN TRÚC HỆ THỐNG AGENTRA</text>
<text x="60" y="100" font-size="21" font-weight="400">Client–server ba tầng · Backend nguyên khối mô-đun (modular monolith)</text>
<text x="1150" y="400" font-size="21" font-weight="700">DỊCH VỤ TÍCH HỢP NGOÀI</text>
<text x="90" y="835" font-size="18" font-weight="400">Xuyên suốt: cấu hình · lỗi API · request ID · logging · phiên DB</text>
<text x="60" y="1132" font-size="18" font-weight="400">Mũi tên hai chiều: yêu cầu / phản hồi. Nét đứt: email phụ thuộc cấu hình.</text>
<text x="60" y="1163" font-size="18" font-weight="400">Sơ đồ từ mã nguồn ngày 06/11/2026; không xác nhận trạng thái dịch vụ đang chạy.</text></g></svg>
