name: dms

# Bound container logs so long-running development services do not grow indefinitely.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: dms-backend:local
    build:
      context: ./backend
      target: runtime
    env_file:
      - ./backend/.env
    # Direct API/docs access from this machine; frontend proxies over the network.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: ./ui
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]
    restart: "no"
