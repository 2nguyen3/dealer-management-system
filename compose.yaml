name: dms

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: ./ui
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]
    restart: "no"
